# Autostart settings. For values of these variables see /etc/sway/variables
# You can add your own applications or daemons here

exec {
    $polkit_agent
    $swappy_notify
    $wlsunset
    $autotiling
    $switch_toplevel
    $help_menu
    $cliphist_store
    $cliphist_watch
    $autoname_workspaces
    $thunar_daemon
    $swaykbdd
}
exec_always {
    $nwg_drawer_daemon
    $watch_playerctl
    $calendar_daemon
    $swayosd
}
